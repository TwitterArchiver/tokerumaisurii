  <div class="tweet-content">
  刷牙的时候构思了一个很香的点子。
  <br/>
  小虚空和小男友约好嗑药做爱，吃下好多片地西泮的小虚空迷迷糊糊，被小男友玩得软糯丝滑。小男友摸了摸小虚空的脑袋，沉醉地夸她好乖好温顺，没想到小虚空却突然哈气了。
  <br/>
  “我好嫉妒……你喜欢药物还是喜欢我……”
  <br/>
  “我、我不吃药明明也很温顺很喜欢你……呜……”
  <br/>
  幸运的是，这只哈气咪马上被紧紧抱住了，被抚摸着背部顺毛。
  <br/>
  “我喜欢你。”
  <br/>
  “不管有没有药物的存在，我都会喜欢你，也只喜欢你。”
