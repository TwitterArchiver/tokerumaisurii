  <div class="tweet-content">
  我印象里一直把听人唱的《公元1997》记成了一首贺岁曲，深深感叹那时候的人们生活怎么那么有意境，写得出「1997年 我就这样走近你」这样的歌词。
  <br/>
  后来我查了一下这其实是国内视角看香港回归的曲子，「你」指的是香港而不是1997年，歌词我也记歪了比如「走近」实为「走进」，一下子心里的意境都崩塌了。
